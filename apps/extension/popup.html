<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LSC AI Auto Filler</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --panel: #fffdf8;
        --ink: #171717;
        --muted: #64615a;
        --accent: #1f6feb;
        --accent-soft: rgba(31, 111, 235, 0.12);
        --border: rgba(23, 23, 23, 0.12);
        --success: #16a34a;
        --error: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #fff9ef 0%, var(--bg) 55%, #efe9db 100%);
      }

      .shell {
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 32px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 700;
      }

      p.subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 16px 0 6px;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 13px;
        font-size: 14px;
        background: white;
        outline: none;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus { border-color: var(--accent); }

      .file-drop {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 20px;
        background: white;
        cursor: pointer;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        transition: border-color 0.15s, background 0.15s;
      }
      .file-drop:hover { border-color: var(--accent); background: var(--accent-soft); }
      .file-drop input[type="file"] { display: none; }

      #file-list {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
        line-height: 1.6;
      }

      .row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .primary {
        background: var(--accent);
        color: white;
        flex: 1;
        justify-content: center;
      }

      .secondary {
        background: var(--accent-soft);
        color: var(--accent);
      }

      /* Spinner shown when button has data-loading="true" */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .primary[data-loading="true"]::before {
        content: '';
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.4);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      /* Status bar */
      #status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        min-height: 42px;
        display: flex;
        align-items: center;
        background: rgba(0,0,0,0.04);
        color: var(--muted);
        border: 1px solid transparent;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
        word-break: break-word;
      }
      #status[data-type="error"] {
        background: #fef2f2;
        color: var(--error);
        border-color: #fecaca;
      }
      #status[data-type="success"] {
        background: #f0fdf4;
        color: var(--success);
        border-color: #bbf7d0;
      }
      #status[data-type="info"] {
        background: #eff6ff;
        color: var(--accent);
        border-color: #bfdbfe;
      }

      /* Profile output */
      pre#profile {
        margin: 20px 0 0;
        padding: 16px;
        border-radius: 12px;
        background: #111827;
        color: #e5e7eb;
        overflow: auto;
        max-height: 360px;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.6;
        font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      }

      .section-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 24px 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>LSC AI Auto Filler</h1>
        <p class="subtitle">Upload your resume, cover letter, or certificates — the AI will extract a profile used to fill job applications automatically.</p>

        <label for="full-name-input">Your full name</label>
        <input id="full-name-input" type="text" placeholder="e.g. Jane Smith" />

        <label>Documents (PDF, DOCX, TXT)</label>
        <label class="file-drop">
          <input
            id="document-input"
            type="file"
            multiple
            accept=".txt,.md,.json,.csv,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          />
          Click to select files — or drag and drop here
        </label>
        <div id="file-list"></div>

        <div class="row">
          <button id="ingest-button" class="primary">Ingest documents</button>
          <button id="refresh-button" class="secondary">Refresh</button>
        </div>

        <div id="status" data-type="info">Connecting to API…</div>

        <div class="section-title">Current profile</div>
        <pre id="profile">Loading…</pre>
      </div>

      <div class="card" style="margin-top:20px">
        <h1 style="font-size:16px">AI Provider Settings</h1>
        <p class="subtitle">Choose which AI model powers the answer generation.</p>

        <label for="provider-select">Provider</label>
        <select id="provider-select" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:14px;background:white;outline:none;cursor:pointer;font-family:inherit">
          <option value="ollama">Ollama (local)</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
        </select>

        <label for="model-input">Model</label>
        <input id="model-input" type="text" list="model-datalist" placeholder="e.g. llama3.1, gpt-4o-mini, claude-haiku-4-5-20251001" />
        <datalist id="model-datalist"></datalist>

        <div id="api-key-row">
          <label for="api-key-input">API Key</label>
          <input id="api-key-input" type="password" placeholder="sk-…" />
        </div>

        <div class="row" style="margin-top:16px">
          <button id="save-settings-button" class="primary">Save Settings</button>
        </div>
        <div id="settings-status" data-type="info" style="display:none"></div>
      </div>
    </div>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
